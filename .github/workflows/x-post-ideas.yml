name: X Post Ideas Generator

on:
  schedule:
    - cron: '0 22 * * *'   # 7:00 JST  (22:00 UTC)
    - cron: '0 3 * * *'    # 12:00 JST (03:00 UTC)
    - cron: '0 9 * * *'    # 18:00 JST (09:00 UTC)
    - cron: '0 13 * * *'   # 22:00 JST (13:00 UTC)
  workflow_dispatch:

jobs:
  generate-ideas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: cookies.json を作成
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          python3 -c "
          import base64, os
          val = ''.join(os.environ['X_COOKIES'].split())
          open('cookies.json', 'wb').write(base64.b64decode(val))
          print('cookies.json 作成完了')
          "

      - name: credentials.json を作成
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python3 -c "import os; open('credentials.json','w').write(os.environ['GOOGLE_CREDENTIALS'])"

      - name: Generate and post ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python main.py
