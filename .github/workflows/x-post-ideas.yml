name: X Post Ideas Generator

on:
  schedule:
    - cron: '7 22 * * *'   # 7:07 JST  (22:07 UTC)
    - cron: '7 3 * * *'    # 12:07 JST (03:07 UTC)
    - cron: '7 9 * * *'    # 18:07 JST (09:07 UTC)
    - cron: '7 13 * * *'   # 22:07 JST (13:07 UTC)
  workflow_dispatch:

jobs:
  generate-ideas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: python -m playwright install-deps chromium

      - name: cookies.json を作成
        env:
          X_COOKIES: ${{ secrets.X_COOKIES }}
        run: |
          python3 -c "
          import base64, os
          val = ''.join(os.environ['X_COOKIES'].split())
          open('cookies.json', 'wb').write(base64.b64decode(val))
          print('cookies.json 作成完了')
          "

      - name: credentials.json を作成
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python3 -c "import os; open('credentials.json','w').write(os.environ['GOOGLE_CREDENTIALS'])"

      - name: Healthcheck start ping
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_URL }}/start" || true

      - name: Generate and post ideas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python main.py

      - name: Healthcheck success ping
        if: success()
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_URL }}" || true

      - name: Healthcheck fail ping
        if: failure()
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_URL }}/fail" || true
